<svg xmlns="http://www.w3.org/2000/svg" width="900" height="282" viewBox="0 0 900 282" role="img" aria-labelledby="title desc">
  <title id="title">Ideas to working systems</title>
  <desc id="desc">Four areas of work: infrastructure and systems, full-stack software, computer vision, and tools made to solve personal needs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#16263A"/>
    </linearGradient>
  </defs>
  <rect width="900" height="282" rx="18" fill="url(#bg)"/>
  <text x="30" y="43" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Ideas → working systems</text>
  <text x="31" y="69" fill="#A8B8CB" font-family="system-ui, sans-serif" font-size="14">Research, software, infrastructure, and the tools I wish existed.</text>

  <rect x="30" y="96" width="406" height="78" rx="12" fill="#192B3D" stroke="#31546A"/>
  <rect x="30" y="96" width="5" height="78" rx="2" fill="#67E8F9"/>
  <text x="51" y="128" fill="#67E8F9" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Infrastructure &amp; systems</text>
  <text x="51" y="153" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="14">Distributed jobs · Kubernetes · Terraform</text>

  <rect x="464" y="96" width="406" height="78" rx="12" fill="#1C2942" stroke="#43568B"/>
  <rect x="464" y="96" width="5" height="78" rx="2" fill="#A5B4FC"/>
  <text x="485" y="128" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Full-stack software</text>
  <text x="485" y="153" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="14">Interfaces · APIs · data · real-time media</text>

  <rect x="30" y="188" width="406" height="78" rx="12" fill="#20303A" stroke="#46685D"/>
  <rect x="30" y="188" width="5" height="78" rx="2" fill="#86EFAC"/>
  <text x="51" y="220" fill="#86EFAC" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Computer vision</text>
  <text x="51" y="245" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="14">Sim2Real · tracking · sports video</text>

  <rect x="464" y="188" width="406" height="78" rx="12" fill="#32283D" stroke="#795276"/>
  <rect x="464" y="188" width="5" height="78" rx="2" fill="#F9A8D4"/>
  <text x="485" y="220" fill="#FBCFE8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Tools I needed</text>
  <text x="485" y="245" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="14">Desktop apps · CLIs · developer tools</text>
</svg>
